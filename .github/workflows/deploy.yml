name: Deploy to GitHub Pages

# Dev preview of the wiki. The real wiki is built and served by iGEM from
# .gitlab-ci.yml; this workflow only mirrors it onto GitHub Pages:
#   /                        -> the wiki (repo root)
#   /modelleing-frontend/    -> the NECTAR modelling GUI (modelleing-frontend/)
#   /local/                  -> the dev-only clips and icons (see below)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Wiki -------------------------------------------------------------
      # vite.config.ts sets base to /<team-slug>/ for igem.wiki; Pages serves
      # this repo from the domain root, so override it here only.
      - run: yarn install --frozen-lockfile
      - run: yarn build --base /

      # --- Modelling frontend ----------------------------------------------
      - working-directory: modelleing-frontend
        run: npm ci
      - working-directory: modelleing-frontend
        run: npm run build -- --base /modelleing-frontend/
        env:
          # Always ship the mock backend on Pages — there is no live API to
          # point at, so a broken/misconfigured deploy can never try to reach one.
          VITE_API_MODE: mock

      - name: Assemble site
        run: |
          cp -a modelleing-frontend/dist dist/modelleing-frontend
          # The wiki uses BrowserRouter; serve index.html for deep links.
          cp dist/index.html dist/404.html

      # --- Dev-only media ---------------------------------------------------
      # The home hero and the Varroa slide load their clips from /local/, and
      # the engineering comb and the HONEY badge fall back to /local/ while
      # their icons and logo are not yet on static.igem.wiki (the bee scene
      # artwork and the comb photo already are). That is public/local/ in the source
      # tree, gitignored so nothing heavy can reach the iGEM build (5 MB
      # ceiling; video must come from the Video Universe). The sources are
      # tracked under wiki-assets-source/images_dev/ for the moment, so this
      # preview puts them where the components look. Copy only what the
      # components reference. Remove this step once the clips are embedded
      # from the Video Universe and the icons and logo answer from static.igem.wiki.
      - name: Add dev-only media
        run: |
          mkdir -p dist/local/eng-icons
          cp wiki-assets-source/images_dev/bees_entering_hive_short.mp4 dist/local/
          cp wiki-assets-source/images_dev/mite_back.mp4 dist/local/
          cp wiki-assets-source/images_dev/oxford-igem-logo.png dist/local/
          cp wiki-assets-source/images_dev/eng-icons-upload/*.svg dist/local/eng-icons/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
